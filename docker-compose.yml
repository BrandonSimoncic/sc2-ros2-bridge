services:
  sc2-server:
    build:
      context: ./sc2_server
    image: sc2-server:pysc2
    container_name: sc2-server
    command: >
      /root/StarCraftII/Versions/Base75025/SC2_x64
      -listen 0.0.0.0
      -port 8167
      -displayMode 0
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=${XAUTHORITY:-/root/.Xauthority}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-~/.Xauthority}:/root/.Xauthority:ro
      - ./maps:/root/StarCraftII/Maps
    expose:
      - "8167"
    ports:
      - "8167:8167"
    networks:
      - sc2net
    restart: unless-stopped

  ros2-bridge:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: ros
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    image: sc2-bridge-dev
    container_name: sc2-bridge
    depends_on:
      - sc2-server
    environment:
      - SC2_HOST=sc2-server
      - SC2_PORT=8167
      - SC2_MAP=/root/StarCraftII/Maps/InterloperTest.SC2Map
    volumes:
      - .:/home/ros/ws
    working_dir: /home/ros/ws/ros2_ws
    command: >
      bash -lc "colcon build --symlink-install &&
      source install/setup.bash &&
      ros2 launch sc2_bridge sc2_bridge.launch.py"
    networks:
      - sc2net

networks:
  sc2net:
    driver: bridge
